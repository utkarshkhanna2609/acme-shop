input {
  beats { port => 5044 }
}

filter {
  # Filebeat's container metadata is large; keep the parts worth searching.
  mutate {
    rename => { "[container][name]" => "container_name" }
    remove_field => ["agent", "ecs", "input", "host", "log", "stream", "container", "event"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-acme-%{+YYYY.MM.dd}"
    data_stream => false
  }
}
