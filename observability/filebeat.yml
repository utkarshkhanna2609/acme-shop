# Ships the JSON logs of every container labelled co.elastic.logs/enabled=true
# to Logstash.
filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      # Off unless a container opts in with the label; this is the input the
      # label turns on.
      hints.default_config:
        enabled: false
        type: container
        paths:
          - /var/lib/docker/containers/${data.container.id}/*.log

processors:
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true

output.logstash:
  hosts: ["logstash:5044"]

logging.level: warning
